spring.application.name=dispatch-load-balancer

# 🟢 TEMPORARY H2 IN-MEMORY DATABASE SETUP (Zero Installation Needed)
spring.datasource.url=jdbc:h2:mem:dispatch_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 🔴 COMMENT OUT POSTGRESQL FOR LOCAL RUNNING
# spring.datasource.url=jdbc:postgresql://localhost:5432/dispatch_db
# spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Ensure the API docs path matches what Swagger UI looks for
springdoc.api-docs.path=/v3/api-docs

# Ensure the UI path is correctly pointed
springdoc.swagger-ui.path=/swagger-ui.html

# standard production overrides for Spring Boot runtime environments
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

